spring:
  application:
    name: ofbiz-abacus

  datasource:
    url: jdbc:h2:mem:ofbiz;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

logging:
  level:
    root: INFO
    com.landawn.ofbiz: DEBUG
    org.hibernate.SQL: DEBUG
