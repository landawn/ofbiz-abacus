spring:
  application:
    name: ofbiz-abacus

  # Eager initialization: the ~294 abacus-jdbc DAO proxies build at context refresh.
  # Safe again now that the proxy-build OOM is fixed in abacus-query 4.7.3. With the
  # devtools restart classloader disabled (OfbizAbacusApplication.main()) eager build is
  # ~26ms/proxy / ~8s.
  main:
    lazy-initialization: false

  datasource:
    url: jdbc:h2:mem:ofbiz;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # No JPA / Hibernate — persistence layer is abacus-jdbc.
  jpa:
    open-in-view: false

  # Flyway is unused; schema is initialized from docs/db/H2.sql below.
  flyway:
    enabled: false

  # Load the generated OFBiz schema + seed data straight from the project docs
  # folder. This is fine for the in-memory H2 used during development.
  sql:
    init:
      mode: always
      schema-locations: file:./docs/db/H2.sql
      # The OFBiz seed data has a handful of duplicate rows (e.g. GEO_ASSOC IT-CB). Allow
      # continue-on-error so a single bad row doesn't take down the whole boot.
      continue-on-error: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env

logging:
  level:
    root: INFO
    com.landawn.ofbiz: DEBUG
